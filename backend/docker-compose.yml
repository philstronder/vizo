name: vizo-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: vizo-postgres
    environment:
      POSTGRES_USER: vizo
      POSTGRES_PASSWORD: vizo
      POSTGRES_DB: vizo
    ports:
      - "5433:5432"
    volumes:
      - vizo_pgdata:/var/lib/postgresql/data

volumes:
  vizo_pgdata:
